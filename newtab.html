<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Tab Dashboard</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div class="Simon-header">
    <h1 id="Simon">Simon</h1>
  </div>

  <div class="dashboard-container">
    <!-- Time & Greeting -->
    <div class="header-section">
      <h1 id="clock">00:00:00</h1>
      <!-- Her er tilføjet et element til din tidsberegner -->
      <p id="greeting">Hello!</p>
    </div>

  <div class="card" id="simon-age-card">
    <h3>Simons alder</h3>
    <p id="simon-age"></p>
  </div>

    <!-- Widgets Grid -->
    <div class="widgets-grid">
      <!-- Weather Widget -->
      <div class="card" id="weather-card">
        <h3>Weather</h3>
        <p id="weather-info">Loading weather...</p>
      </div>

      <!-- To-Do List Widget -->
      <div class="card" id="todo-card">
        <h3>Productivity Tasks</h3>
        <div class="todo-input-group">
          <input type="text" id="task-input" placeholder="Add a new task">
          <button id="add-task-btn">Add</button>
        </div>
        <ul id="task-list"></ul>
      </div>
    </div>

<div class="card calendar-card">
    <!-- Top-del med måned og pile på siderne -->
    <div class="calendar-header">
        <button id="prev-month">&#10094;</button>
        <h2 id="month-year">MONTH YEAR</h2>
        <button id="next-month">&#10095;</button>
    </div>

    <!-- Ugedage -->
    <div class="weekdays">
        <div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div><div>Su</div>
    </div>

    <!-- Datoer -->
    <div id="days-container" class="days-grid"></div>
</div>

<div class="container">
    <input type="text" placeholder="Search..." id="Search">
    <div class="search" tabindex="0"></div>
</div>
  
  <script src="newtab.js"></script>
</body>
</html>
